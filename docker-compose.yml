services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: neuroshield
      POSTGRES_PASSWORD: neuroshield_password
      POSTGRES_DB: neuroshield_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroshield -d neuroshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_v2:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo_password
      POSTGRES_DB: lumo_db
    ports:
      - "5434:5432"
    volumes:
      - lumo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo -d lumo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lumo_postgres_data:
